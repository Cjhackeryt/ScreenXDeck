<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="screen-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="104" fill="url(#bg-grad)" stroke="#334155" stroke-width="4" />

  <!-- Outer ambient glow circle -->
  <circle cx="256" cy="230" r="160" fill="url(#screen-grad)" opacity="0.15" filter="url(#glow)" />

  <!-- Secondary Monitor (Behind, shifted right & up) -->
  <g transform="translate(190, 80) scale(0.68)" opacity="0.75">
    <rect x="0" y="0" width="300" height="200" rx="14" fill="#1e293b" stroke="#475569" stroke-width="6" />
    <rect x="12" y="12" width="276" height="176" rx="8" fill="url(#screen-dark)" />
    <!-- Stand -->
    <path d="M125,200 L175,200 L185,250 L115,250 Z" fill="#334155" />
    <rect x="85" y="245" width="130" height="12" rx="6" fill="#475569" />
  </g>

  <!-- Primary Monitor (Front & Center) -->
  <g transform="translate(76, 120)">
    <!-- Monitor Bezel with glowing gradient border -->
    <rect x="0" y="0" width="360" height="230" rx="18" fill="#111827" stroke="url(#screen-grad)" stroke-width="5" filter="url(#glow)" />
    <!-- Screen Display Area -->
    <rect x="12" y="12" width="336" height="206" rx="10" fill="url(#screen-dark)" />
    
    <!-- Window inside monitor with titlebar -->
    <rect x="32" y="32" width="220" height="140" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect x="32" y="32" width="220" height="26" rx="8" fill="#0f172a" />
    <!-- Window controls -->
    <circle cx="48" cy="45" r="4.5" fill="#ef4444" />
    <circle cx="62" cy="45" r="4.5" fill="#f59e0b" />
    <circle cx="76" cy="45" r="4.5" fill="#10b981" />
    
    <!-- Window content mockup lines -->
    <rect x="50" y="74" width="110" height="8" rx="4" fill="#38bdf8" opacity="0.8" />
    <rect x="50" y="94" width="160" height="6" rx="3" fill="#64748b" opacity="0.7" />
    <rect x="50" y="110" width="130" height="6" rx="3" fill="#64748b" opacity="0.7" />
    <rect x="50" y="126" width="90" height="6" rx="3" fill="#64748b" opacity="0.7" />

    <!-- Pin badge (Always on Top) on the window -->
    <circle cx="230" cy="45" r="7" fill="#38bdf8" />
    <path d="M230,41 L230,49 M226,45 L234,45" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

    <!-- Brightness & Refresh overlay badge on the right -->
    <g transform="translate(262, 50)">
      <!-- Sun icon for brightness -->
      <circle cx="28" cy="28" r="12" fill="url(#accent-grad)" />
      <!-- Sun rays -->
      <line x1="28" y1="8" x2="28" y2="4" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="48" x2="28" y2="52" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="8" y1="28" x2="4" y2="28" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="48" y1="28" x2="52" y2="28" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="14" y1="14" x2="11" y2="11" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="42" y1="42" x2="45" y2="45" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="42" y1="14" x2="45" y2="11" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <line x1="14" y1="42" x2="11" y2="45" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      
      <!-- Refresh badge Hz -->
      <rect x="-8" y="70" width="72" height="26" rx="6" fill="#0284c7" />
      <text x="28" y="88" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">144Hz</text>
    </g>

    <!-- Monitor Stand -->
    <path d="M150,230 L210,230 L220,290 L140,290 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="100" y="285" width="160" height="15" rx="7.5" fill="#334155" />
    <rect x="130" y="289" width="100" height="4" rx="2" fill="#64748b" />
  </g>

  <!-- Display Numbers Badges 1 2 3 4 -->
  <g transform="translate(146, 420)">
    <rect x="0" y="0" width="45" height="30" rx="8" fill="#0284c7" />
    <text x="22.5" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1</text>
    
    <rect x="60" y="0" width="45" height="30" rx="8" fill="#334155" />
    <text x="82.5" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2</text>
    
    <rect x="120" y="0" width="45" height="30" rx="8" fill="#334155" />
    <text x="142.5" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3</text>
    
    <rect x="180" y="0" width="45" height="30" rx="8" fill="#334155" />
    <text x="202.5" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4</text>
  </g>
</svg>
